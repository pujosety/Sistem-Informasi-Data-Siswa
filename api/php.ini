; PHP settings for the Vercel function.
;
; The runtime concatenates this file onto the shipped php.ini, so only
; overrides belong here — the defaults are already correct and re-stating
; them would only risk contradicting the runtime.
;
; memory_limit
;
; The default is 128M, which is not enough for the two heaviest operations
; SIDA performs: an XLSX export streams the whole student query through
; PhpSpreadsheet, and a dompdf report holds the rendered document plus its
; font cache. Both fail with a fatal "Allowed memory size exhausted" that
; surfaces as a bare 500.
;
; Capped at 1536M rather than the function's full 2048M on purpose. The
; runtime, its own libraries, and the S3 client all need headroom, and a PHP
; limit set equal to the container limit is what turns a recoverable
; memory-pressure condition into an OOM kill of the whole function.
;
; 2048MB is also the ceiling on a Vercel Hobby plan; asking for more makes
; the deploy fail outright rather than degrading.
memory_limit = 1536M

; post_max_size / upload_max_filesize
;
; Student documents are KK, KTP and birth certificates, scanned or
; photographed on a phone. 8M per file is generous for a photo of a page and
; keeps a single oversized upload from taking the whole function down.
;
; Both must agree: post_max_size caps the whole request body, and Laravel's
; validation reads the uploaded file size against upload_max_filesize. If the
; former is the smaller of the two the upload fails with a confusing "the
; file was only partially uploaded" rather than a field validation message.
post_max_size = 8M
upload_max_filesize = 8M

; max_execution_time
;
; A report PDF can legitimately take a while on a cold container. The
; function's own maxDuration in vercel.json is the real ceiling — this only
; needs to sit above the worst-case request so PHP does not cut a report in
; half while the function would still have had time to finish it.
max_execution_time = 60

; Sessions and compiled views
;
; Both are redirected to /tmp through the *_CACHE and VIEW_COMPILED_PATH
; environment variables in vercel.json. That is what keeps them off the
; read-only function filesystem, which would otherwise fail a request rather
; than a build.
session.save_path = /tmp
sys_temp_dir = /tmp
