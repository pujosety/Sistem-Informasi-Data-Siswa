<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="LYFLA — Learning and Your Future, Linked Anywhere">
  <!--
    LYFLA HORIZONTAL LOCKUP — icon + wordmark.

    Sized so the mark is the same optical weight as the cap-height of the
    wordmark. A mark that dwarfs the type reads as a mascot; one that disappears
    reads as a bug icon. 44px of mark against a 40px cap-height is the balance.
  -->

  <g transform="translate(4 4) scale(0.875)">
    <path d="M8 16c6.5-3.2 13-3.6 20-1.4v34c-7-2.2-13.5-1.8-20 1.4z" fill="#7A1F32"/>
    <path d="M56 16c-6.5-3.2-13-3.6-20-1.4v34c7-2.2 13.5-1.8 20 1.4z" fill="#4A111D"/>
    <path d="M30.4 14.9v34.6" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="44.5" cy="40.5" r="3.2" fill="#B08D3F"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <!--
      The wordmark is real text, not outlined paths. Two reasons: it stays
      selectable and searchable for screen readers, and it stays crisp at any
      size without shipping four SVG variants. The letter-spacing is opened up
      because LYFLA is an initialism — tracking is what stops it reading as a
      word.
    -->
    <text x="80" y="41"
          font-size="30"
          font-weight="700"
          letter-spacing="3.2"
          fill="#241A1C">LYFLA</text>

    <text x="81" y="55"
          font-size="8.5"
          font-weight="500"
          letter-spacing="0.9"
          fill="#8A7479">LEARN • GROW • BELONG</text>
  </g>
</svg>