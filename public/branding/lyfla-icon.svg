<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LYFLA">
  <!--
    LYFLA MARK — open book whose two pages rise into a path, with the negative
    space between them forming an implicit L.

    WHY THIS SHAPE:
      - Reads at 16px: two distinct page shapes, not one blob.
      - Survives monochrome: the gap carries the silhouette, not a colour.
      - The L is present for anyone who looks for it, rather than shouted.
      - No gradient, no shadow, no filter — it must stay crisp on a favicon.
  -->

  <!-- Left page: the vertical stroke of the L, doubled as an open cover -->
  <path d="M8 16c6.5-3.2 13-3.6 20-1.4v34c-7-2.2-13.5-1.8-20 1.4z"
        fill="#7A1F32"/>

  <!-- Right page: rising away, the "future" half of the name -->
  <path d="M56 16c-6.5-3.2-13-3.6-20-1.4v34c7-2.2 13.5-1.8 20 1.4z"
        fill="#4A111D"/>

  <!-- Spine gap: the L's negative space, and the literal path between pages -->
  <path d="M30.4 14.9v34.6"
        stroke="#FBF9F8"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Growth node: the dot on the path, where "linked anywhere" becomes visible -->
  <circle cx="44.5" cy="40.5" r="3.2" fill="#B08D3F"/>
</svg>