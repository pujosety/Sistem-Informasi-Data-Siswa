# Local development stack — deliberately minimal.
#
# One PHP container (artisan serve) + one MySQL. No nginx, no PHP-FPM, no
# supervisord: that trio only earns its keep in production, and carrying it
# here made local work slower and harder to reason about.
#
# vendor/ lives in a named volume because ~9k small files on a Windows bind
# mount make every request crawl (artisan boot went from 0.4s to 11s).
# Run `bash sync-vendor.sh` once after changing dependencies.

services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    working_dir: /var/www/html
    environment:
      WORKSPACE_WOPI_HOST_URL: "${WORKSPACE_WOPI_HOST_URL:-http://host.docker.internal:8000}"
      COLLABORA_INTERNAL_URL: "${COLLABORA_INTERNAL_URL:-http://collabora:9980}"
      COLLABORA_PUBLIC_URL: "${COLLABORA_PUBLIC_URL:-http://localhost:9980}"
    # `artisan serve` is a SINGLE-process server, and it caches the framework
    # in memory on boot. That combination is why it answered 500 while the very
    # same request returned 200 through the kernel: the boot happened before
    # .env existed, so APP_KEY was empty in that process, and one cached
    # bootstrap cannot recover from a file appearing underneath it. The
    # multi-worker built-in server below reads the environment per request and
    # is what production (PHPix) does too.
    command: sh -c "PHP_CLI_SERVER_WORKERS=4 php -S 0.0.0.0:8000 -t public"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: siswa_data
      MYSQL_USER: siswa
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usiswa", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional local-only WOPI client. Do not use CODE as a production service.
  collabora:
    image: collabora/code:26.04.4.2.1
    profiles: ["collabora"]
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      aliasgroup1: "${WORKSPACE_WOPI_HOST_URL:-http://host.docker.internal:8000}"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=false --o:welcome.enable=false"
    ports:
      - "127.0.0.1:9980:9980"
    depends_on:
      app:
        condition: service_started

  # Opt-in only: check Docker RAM/free disk before starting. No host port.
  clamav:
    image: "${WORKSPACE_CLAMAV_IMAGE:-clamav/clamav:1.4_base}"
    profiles: ["scanner"]
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - clamav-signatures:/var/lib/clamav
      - ./docker/clamd-workspace.conf:/etc/clamav/clamd.conf:ro

volumes:
  clamav-signatures:
  mysql-data:
  vendor-data:
