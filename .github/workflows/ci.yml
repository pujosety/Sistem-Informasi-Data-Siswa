name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (${{ matrix.php }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: siswa_data_testing
          MYSQL_USER: siswa
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip
          coverage: none

      - name: Validate composer.json / lock
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The application's own .env.testing supplies a throwaway database and
      # APP_KEY. No production credential is involved: DB_HOST has to point at
      # the service container, which is the only secret-adjacent value here.
      - name: Point .env.testing at the MySQL service
        run: |
          cp .env.testing .env.testing.ci
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          mv .env.testing.ci .env.testing

      - name: Prepare application key
        run: php artisan key:generate --env=testing --force

      - name: Run migrations
        run: php artisan migrate --force --env=testing

      - name: Run test suite
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  blade:
    name: Blade templates compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check every Blade template compiles
        run: php tools/lint-views.php
