# Private Docker network only; do not publish clamd's unauthenticated TCP port.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
FailIfCvdOlderThan 7
ConcurrentDatabaseReload no
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 10000
MaxThreads 2
MaxQueue 4
ReadTimeout 30
CommandReadTimeout 5
MaxScanTime 25000
# Fail closed when archive limits are reached or content cannot be inspected.
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
