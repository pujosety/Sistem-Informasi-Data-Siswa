# Wasmer Edge application configuration.
# Schema/data preparation is chained into start so a failed migration stops the
# release instead of leaving an apparently healthy app on an old schema.
kind: wasmer.io/App.v0
name: SIDA

scripts:
  install: |
    composer install --optimize-autoloader --ignore-platform-reqs --no-scripts --no-interaction
    npm install

  build: |
    composer run-script post-update-cmd
    npm run build

  start: |
    php artisan config:clear \
      && php artisan cache:clear \
      && php artisan migrate --force --no-interaction \
      && php artisan db:seed --class=PermissionSeeder --force --no-interaction \
      && php artisan config:cache \
      && php artisan route:cache \
      && php -S 0.0.0.0:${PORT:-8080} -t public
